<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup Studio 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#131418;--p:#1c1e24;--p2:#252830;--line:#32353f;--tx:#e6e7ea;--mut:#9094a0;--ac:#7c5cff;--ac2:#a48bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr 330px;grid-template-rows:46px 1fr;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--p);border-bottom:1px solid var(--line)}
header b{font-size:15px;letter-spacing:.3px;margin-right:10px}
header b i{color:var(--ac2);font-style:normal}
.sp{flex:1}
button,select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.rec{background:#d6336c;border-color:#d6336c;color:#fff;font-weight:600}
select{max-width:100%}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
#lib{background:var(--p);border-right:1px solid var(--line);overflow:auto;padding:8px}
#lib h4{margin:12px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
#lib h4:first-child{margin-top:2px}
#lib button{display:block;width:100%;text-align:left;margin-bottom:4px;background:transparent;border-color:transparent;padding:6px 9px}
#lib button:hover{background:var(--p2)}
#lib button.on{background:var(--ac);color:#fff}
#stage{display:flex;min-width:0;min-height:0;position:relative}
#view{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;background:#0c0d10;overflow:hidden}
#view.checker canvas{background:repeating-conic-gradient(#3a3d46 0 25%,#2b2e36 0 50%) 0 0/22px 22px}
#gl{display:block;touch-action:none;box-shadow:0 0 0 1px #000,0 10px 40px #0008}
.hud{position:absolute;left:12px;pointer-events:none;background:#000a;color:#fff;padding:4px 9px;border-radius:6px;font-size:12px;max-width:80%}
#hudSel{top:10px}#hudTip{bottom:10px;color:#cfd2da}
#recDot{position:absolute;top:10px;right:12px;background:#d6336c;color:#fff;padding:4px 10px;border-radius:20px;font-weight:600;display:none}
#magNav{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:#000b;padding:5px 8px;border-radius:22px;color:#fff;font-size:12.5px;white-space:nowrap}
#magNav button{border-radius:50%;width:30px;height:30px;padding:0;background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.4;cursor:default}
#editor{width:44%;min-width:320px;display:none;flex-direction:column;background:var(--p);border-right:1px solid var(--line)}
#editor.open{display:flex}
#edBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
#edBar input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
#edBar input[type=range]{width:80px}
#edBar label{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:12px}
#edArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:repeating-conic-gradient(#2a2d35 0 25%,#22252c 0 50%) 0 0/20px 20px;overflow:hidden}
#edHost{position:relative;box-shadow:0 4px 24px #000a;background:#fff}
#edHost canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#edHost canvas.ov{cursor:crosshair;touch-action:none}
#edHost canvas.mask{opacity:.75}
#panel{background:var(--p);border-left:1px solid var(--line);overflow:auto}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:9px 12px;font-weight:600;user-select:none;background:#20232a}
details>div{padding:8px 12px 12px}
.row{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;margin:5px 0}
.row .lab{color:var(--mut);font-size:12px}
.row output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.row.two{grid-template-columns:104px 1fr}
.row input[type=range]{width:100%;accent-color:var(--ac);margin:0}
.row input[type=color]{width:100%;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.row select,.row input[type=text]{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.btns button{flex:1}
.tip{color:var(--mut);font-size:11.5px;margin:6px 0 2px}
h5{margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ac2)}
header{overflow-x:auto}header b{white-space:nowrap}
@media(max-width:1000px){#app{grid-template-columns:150px 1fr 270px}.row{grid-template-columns:84px 1fr 38px}.row.two{grid-template-columns:84px 1fr}}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:46px 44px 52vh 1fr}header{grid-column:1}#lib{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}#lib h4{display:none}#lib button{width:auto;margin:0;white-space:nowrap}#panel{border-left:0}#editor.open{position:absolute;inset:0;width:100%;z-index:5}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3a3d48;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Mockup <i>Studio 3D</i></b>
    <div class="seg" id="modes"></div>
    <button id="btnEd">✎ Draw / text editor</button>
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="btnSave" title="Save project (Ctrl+S)">💾 Save</button>
    <span class="sp"></span>
    <button id="btnPng" class="pri">📷 Capture image</button>
    <button id="btnRec" class="rec">● Record video</button>
  </header>
  <aside id="lib"></aside>
  <main id="stage">
    <section id="editor">
      <div id="edBar"></div>
      <div id="edArea"><div id="edHost"></div></div>
    </section>
    <section id="view">
      <canvas id="gl"></canvas>
      <div class="hud" id="hudSel"></div>
      <div class="hud" id="hudTip"></div>
      <div id="recDot">● REC <span id="recT"></span></div>
      <div id="magNav"><button id="mPrev" title="Previous page">◀</button><span id="mLab"></span><button id="mNext" title="Next page">▶</button></div>
    </section>
  </main>
  <aside id="panel"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
if(!window.THREE)document.body.innerHTML='<p style="padding:40px;font-size:16px">Could not load three.js — this page needs an internet connection the first time it opens.</p>';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const deg=Math.PI/180,TAU=Math.PI*2,U=.1;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,ss=t=>t*t*(3-2*t);
const hash=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const col=c=>new THREE.Color(c).convertSRGBToLinear();
function el(t,a,...k){const e=document.createElement(t);if(a)for(const n in a){const v=a[n];if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(['value','checked','textContent','innerHTML','title','selected','disabled'].includes(n))e[n]=v;else e.setAttribute(n,v)}for(const c of k.flat())if(c!=null)e.append(c);return e}
function download(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function pickFile(accept,cb){const i=el('input',{type:'file',accept});i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}
const loadImg=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
function mkVideo(f){const v=document.createElement('video');v.src=URL.createObjectURL(f);v.loop=v.muted=true;v.playsInline=true;v.play().catch(()=>{});return v}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

/* ================= state ================= */
const state={mode:'orbit',mock:null,vals:{},surfs:{},st:{},sel:null,list:[],R:1,size:new THREE.Vector3(1,1,1),
  tf:{x:0,y:0,z:0,rx:0,ry:0,rz:0,s:1},spin:0,spinSpeed:0,bobAmp:0,baseY:0,envI:1,
  light:{az:-42,el:56,int:1.5,soft:8,shadow:.34},bg:{mode:'radial',a:'#f1f2f5',b:'#b9bec9',img:null},
  aspect:0,cap:{w:1920,transparent:false,motion:'turntable',dur:6,fps:60,fmt:''},rec:null,holder:null,
  env:'studio',exposure:1.05,fov:32,project:'My mockup',pending:{},anim:null,band:{on:false,h:30,y:50,round:.08,gap:1},
  micro:{hover:false,tilt:false,highlight:false,bounce:false,spin:false,open:false,sway:false,drop:false}};
const allSurfs={};let surfN=0;

/* ================= renderer / scene ================= */
const canvas=$('#gl'),view=$('#view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;renderer.setClearColor(0,0);
const ANISO=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.05,500);
const amb=new THREE.HemisphereLight(0xffffff,0x999999,.25),key=new THREE.DirectionalLight(0xffffff,1.5),fill=new THREE.DirectionalLight(0xffffff,.3);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0004;scene.add(amb,key,key.target,fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:.38}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const modelG=new THREE.Group(),pivot=new THREE.Group(),holderG=new THREE.Group();scene.add(modelG);modelG.add(pivot);pivot.add(holderG);
let body=null;const tmpMats=[];
const HID=new THREE.MeshBasicMaterial({visible:false});
const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();
const ENVS={studio:{n:'Studio softbox',sky:['#f4f5f7','#c9cdd5','#5b5e68'],boxes:[[.1,.16,.16,.3],[.6,.1,.22,.26],[.38,.02,.2,.1]]},
  warm:{n:'Warm sunset',sky:['#ffe1b5','#e7a268','#4b2d22'],boxes:[[.14,.2,.12,.26],[.7,.24,.1,.2]]},
  cool:{n:'Cool daylight',sky:['#e2f0ff','#9fc2e6','#3b4758'],boxes:[[.2,.08,.26,.26],[.72,.2,.1,.3]]},
  dark:{n:'Dark dramatic',sky:['#2c2e36','#131418','#040405'],boxes:[[.1,.14,.07,.42],[.66,.1,.18,.16]]}};
let envRT=null;
function setEnv(name){const P=ENVS[name],c=mkCanvas(1024,512),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,P.sky[0]);gr.addColorStop(.5,P.sky[1]);gr.addColorStop(1,P.sky[2]);g.fillStyle=gr;g.fillRect(0,0,1024,512);
  g.filter='blur(10px)';g.fillStyle='#fff';P.boxes.forEach(b=>g.fillRect(b[0]*1024,b[1]*512,b[2]*1024,b[3]*512));
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
  const rt=pmrem.fromEquirectangular(t);scene.environment=rt.texture;t.dispose();if(envRT)envRT.dispose();envRT=rt}
let bgTex=null;
function setBg(){const b=state.bg;if(bgTex){bgTex.dispose();bgTex=null}
  if(b.mode==='solid')scene.background=new THREE.Color(b.a);
  else if(b.mode==='transparent')scene.background=null;
  else if(b.mode==='image'&&b.img){bgTex=new THREE.Texture(b.img);bgTex.encoding=THREE.sRGBEncoding;bgTex.needsUpdate=true;scene.background=bgTex}
  else{const c=mkCanvas(512,512),g=c.getContext('2d'),gr=b.mode==='radial'?g.createRadialGradient(256,230,10,256,256,380):g.createLinearGradient(0,0,0,512);
    gr.addColorStop(0,b.a);gr.addColorStop(1,b.b);g.fillStyle=gr;g.fillRect(0,0,512,512);bgTex=new THREE.CanvasTexture(c);bgTex.encoding=THREE.sRGBEncoding;scene.background=bgTex}
  view.classList.toggle('checker',b.mode==='transparent');bgFit()}
function bgFit(){const b=state.bg;if(b.mode!=='image'||!bgTex||!b.img)return;const ra=camera.aspect/(b.img.width/b.img.height);
  if(ra>1){bgTex.repeat.set(1,1/ra);bgTex.offset.set(0,(1-1/ra)/2)}else{bgTex.repeat.set(ra,1);bgTex.offset.set((1-ra)/2,0)}}
function placeLight(){const L=state.light,R=state.R,a=L.az*deg,e=L.el*deg,c=new THREE.Vector3(state.tf.x,modelG.position.y,state.tf.z);
  const d=new THREE.Vector3(Math.cos(e)*Math.sin(a),Math.sin(e),Math.cos(e)*Math.cos(a));
  key.position.copy(c).addScaledVector(d,R*5);key.target.position.copy(c);key.intensity=L.int;key.shadow.radius=L.soft;key.shadow.normalBias=R*.006;
  const s=key.shadow.camera,k=R*2.2*state.tf.s;s.left=-k;s.right=k;s.top=k;s.bottom=-k;s.near=R*.2;s.far=R*12;s.updateProjectionMatrix();
  fill.position.copy(c).add(new THREE.Vector3(-d.x,.4,-d.z).multiplyScalar(R*4));ground.material.opacity=L.shadow}

/* ================= camera orbit ================= */
const orb={t:new THREE.Vector3(),th:.6,ph:1.12,r:6};
function camUpdate(){const sp=Math.sin(orb.ph);camera.position.set(orb.t.x+orb.r*sp*Math.sin(orb.th),orb.t.y+orb.r*Math.cos(orb.ph),orb.t.z+orb.r*sp*Math.cos(orb.th));camera.lookAt(orb.t)}
function fitCam(){const R=state.R;orb.t.set(state.tf.x,modelG.position.y,state.tf.z);orb.r=R/Math.sin(Math.atan(Math.tan(camera.fov*deg/2)*Math.min(1,camera.aspect)))*1.12;camera.near=R/60;camera.far=R*300;camera.updateProjectionMatrix()}

/* ================= paper / material presets ================= */
const PRESETS={matte:{n:'Matte paper',rough:.9,pattern:'grain'},uncoated:{n:'Uncoated / offset',rough:.97,pattern:'rough'},
  gloss:{n:'Gloss laminate',rough:.2,coat:.8},satin:{n:'Satin / silk',rough:.5,coat:.15},soft:{n:'Soft-touch',rough:.78},
  newsprint:{n:'Newsprint',rough:1,tint:'#e4dfd0',pattern:'rough'},kraft:{n:'Kraft',rough:.95,tint:'#c9a57a',pattern:'fibre'},
  recycled:{n:'Recycled speckle',rough:.96,tint:'#e9e2d2',pattern:'speckle'},linen:{n:'Linen',rough:.9,pattern:'linen'},
  canvas:{n:'Canvas / felt',rough:.92,pattern:'weave'},metallic:{n:'Metallic / tin',rough:.3,metal:.85},
  brushed:{n:'Brushed metal',rough:.42,metal:1,pattern:'brushed'},plastic:{n:'Gloss plastic',rough:.12,coat:1},film:{n:'Metallised film',rough:.24,metal:.7}};
const patCache={};
function pattern(name){if(patCache[name])return patCache[name];const N=512,c=mkCanvas(N,N),g=c.getContext('2d'),id=g.createImageData(N,N),d=id.data;let rv=0;
  for(let y=0;y<N;y++){if(name==='brushed')rv=(Math.random()-.5)*70;for(let x=0;x<N;x++){let v=128;const r=Math.random()-.5;
    if(name==='grain')v+=r*28;else if(name==='rough')v+=r*64;else if(name==='fibre')v+=r*36;
    else if(name==='speckle')v+=r*30+(Math.random()<.004?-95:0);
    else if(name==='linen')v+=(x%3===0?20:-7)+(y%3===0?20:-7)+r*16;
    else if(name==='weave')v+=46*Math.sin(x*Math.PI/4)*Math.sin(y*Math.PI/4)+r*10;
    else if(name==='brushed')v+=rv+r*10;
    const i=(y*N+x)*4;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}}
  g.putImageData(id,0,0);
  if(name==='fibre')for(let i=0;i<1100;i++){g.strokeStyle=Math.random()<.5?'rgba(255,255,255,.35)':'rgba(0,0,0,.35)';g.lineWidth=1;const x=Math.random()*N,y=Math.random()*N,a=Math.random()*TAU,l=6+Math.random()*26;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  return patCache[name]={c,t:tx(c)}}
function tx(c,srgb){const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;return t}

/* ================= surfaces (artwork + finish) ================= */
const MASKCOL='#ff2bd6',FOILS={gold:'#ffd36b',silver:'#eceef2',rose:'#f7b9a9',copper:'#e58e5e',black:'#3a3a40',holo:'holo',custom:'custom'};
const PAL=['#ff6b4a','#2f6df6','#12b886','#f59f00','#e64980','#7048e8','#0b7285','#d9480f'];
const scratch=mkCanvas(4,4),dirty=new Set();
class Surface{
  constructor(key,label,w,h,o={}){this.uid=++surfN;allSurfs[this.uid]=this;this.key=key;this.label=label;this.o=o;this.kind=o.kind||'default';this.res=o.res||1024;this.custom=false;
    this.finish=o.finish||'none';this.foil=o.foil||'gold';this.foilColor='#ffd36b';this.depth=.7;this.soft=2;this.glow=o.glow||0;this.mask=null;this.video=null;this.sig='';
    this.mat=new THREE.MeshPhysicalMaterial({color:0xffffff});this.setPreset(o.preset||'matte',true);this.w=0;this.setSize(w,h)}
  setPreset(n,quiet){const P=PRESETS[n]||PRESETS.matte;this.preset=n;this.rough=P.rough;this.metal=P.metal||0;this.coat=P.coat||0;this.tint=P.tint||'#ffffff';this.pattern=P.pattern||'';if(!quiet)this.refresh()}
  setSize(w,h){if(Math.abs(this.w-w)<1e-6&&Math.abs(this.h-h)<1e-6)return;this.w=w;this.h=h;if(!this.custom||!this.art)this.alloc();this.refresh()}
  alloc(){const k=this.res/Math.max(this.w,this.h),cw=Math.max(8,Math.round(this.w*k)),ch=Math.max(8,Math.round(this.h*k)),c=mkCanvas(cw,ch),g=c.getContext('2d');
    if(this.custom&&this.art)g.drawImage(this.art,0,0,cw,ch);else drawPlaceholder(g,cw,ch,this);
    this.art=c;if(this.artT){this.artT.image=c;this.artT.needsUpdate=true}else this.artT=tx(c,true);
    if(this.mask){const m=mkCanvas(cw,ch);m.getContext('2d').drawImage(this.mask,0,0,cw,ch);this.mask=m}
    else if(this.o.demoMask){this.mask=mkCanvas(cw,ch);demoMask(this)}
    if(state.sel===this)queueMicrotask(edMount)}
  ensureFull(min=1024){if(this.res<min){this.res=min;this.alloc();this.refresh()}}
  ensureMask(){if(!this.mask){this.mask=mkCanvas(this.art.width,this.art.height)}return this.mask}
  flags(side,flat){const m=this.mat;m.side=side;m.flatShading=!!flat}
  touch(layer){if(layer!=='mask')this.custom=true;dirty.add(this)}
  maskFill(paint){const m=this.mask;scratch.width=m.width;scratch.height=m.height;const g=scratch.getContext('2d');paint(g,m.width,m.height);g.globalCompositeOperation='destination-in';g.drawImage(m,0,0);return scratch}
  derived(n,srgb){if(!this[n]||this[n].width!==this.art.width||this[n].height!==this.art.height){this[n]=mkCanvas(this.art.width,this.art.height);if(this[n+'T'])this[n+'T'].image=this[n];else this[n+'T']=tx(this[n],srgb)}this[n+'T'].needsUpdate=true;return this[n].getContext('2d')}
  refresh(){const m=this.mat,f=this.finish,has=!!this.mask&&f!=='none',foil=has&&f.startsWith('foil'),spot=has&&f==='spot';
    const rel=!has?0:f.includes('emboss')?1:f.includes('deboss')?-1:spot?.25:0,cw=this.art.width,ch=this.art.height,pat=this.pattern?pattern(this.pattern):null;
    this.artT.needsUpdate=true;
    if(this.video)m.map=this.videoT;
    else if(foil){const g=this.derived('mapC',true);g.drawImage(this.art,0,0);
      g.drawImage(this.maskFill((s,w,h)=>{const fc=this.foil==='custom'?this.foilColor:FOILS[this.foil];if(fc==='holo'){const gr=s.createLinearGradient(0,0,w,h);for(let i=0;i<=8;i++)gr.addColorStop(i/8,`hsl(${i*90%360},90%,72%)`);s.fillStyle=gr}else s.fillStyle=fc;s.fillRect(0,0,w,h)}),0,0);m.map=this.mapCT}
