  <style>
:root {
  --bg: #0e0e13;
  --panel: #16161e;
  --panel2: #1d1d28;
  --panel3: #252533;
  --line: #2c2c3c;
  --text: #ececf3;
  --muted: #9b9bb2;
  --dim: #6c6c84;
  --accent: #7c5cff;
  --accent-2: #ff3d6e;
  --ok: #20c4a5;
  --warn: #ffb020;
  --radius: 8px;
  --stage: #0a0a0e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- top bar ---------- */
.topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; stroke: none; }
.group { display: flex; align-items: center; gap: 4px; }
.group.right { margin-left: auto; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; flex: none; }
.grow { flex: 1; }
.savestate { color: var(--dim); font-size: 12px; margin-right: 6px; white-space: nowrap; }
.savestate.err { color: var(--accent-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel2); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--panel3); }
.btn:focus-visible, .tool:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #8e72ff; }
.btn.danger { color: #ff8fa9; }
.btn.icon { width: 32px; padding: 0; }
.btn.small { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.rec { color: #fff; background: var(--accent-2); border-color: var(--accent-2); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.on { background: rgba(124, 92, 255, .22); border-color: var(--accent); }
.panel-toggle { display: none; }

/* ---------- context bar ---------- */
.ctxbar { display: flex; align-items: center; gap: 12px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1; padding-left: 8px; }
.ctxbar::-webkit-scrollbar { display: none; }
.ctxbar .hint { color: var(--muted); white-space: nowrap; }
.field { display: flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--muted); }
.field input[type=range] { width: 92px; }
.field .num { width: 46px; text-align: right; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; }
.brushbtn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 4px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; white-space: nowrap; }
.brushbtn canvas { width: 56px; height: 24px; border-radius: 4px; background: #fff; }
.swatches { display: flex; gap: 4px; align-items: center; }
.sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .15); cursor: pointer; padding: 0; flex: none; }
.sw.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
input[type=color] { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); padding: 2px; cursor: pointer; flex: none; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
input[type=range] { accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
select, input[type=text], input[type=number], textarea {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; min-width: 0;
}
select { padding-right: 4px; }
textarea { resize: vertical; width: 100%; }

/* ---------- workspace ---------- */
.workspace { flex: 1; display: grid; grid-template-columns: 56px minmax(0, 1fr) 320px; min-height: 0; }
.toolbar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; overflow-y: auto; }
.tool { width: 40px; height: 40px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; position: relative; color: var(--muted); }
.tool:hover { background: var(--panel2); color: var(--text); }
.tool.active { background: rgba(124, 92, 255, .2); border-color: var(--accent); color: #fff; }
.tool svg { width: 20px; height: 20px; }
.tool kbd { position: absolute; right: 3px; bottom: 1px; font-size: 9px; color: var(--dim); font-family: inherit; }
.toolbar .tsep { width: 24px; height: 1px; background: var(--line); margin: 4px 0; }

.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage {
  flex: 1; position: relative; overflow: hidden; touch-action: none; min-height: 0;
  background: var(--stage) radial-gradient(circle at 50% 40%, #15151d 0, var(--stage) 70%);
}
.view { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 10px 40px rgba(0, 0, 0, .55); }
.view canvas { position: absolute; left: 0; top: 0; display: block; }
#overlay { pointer-events: none; }
.hud { position: absolute; left: 12px; top: 10px; display: flex; gap: 6px; pointer-events: none; flex-wrap: wrap; }
.chip { background: rgba(14, 14, 19, .78); border: 1px solid var(--line); padding: 3px 9px; border-radius: 99px; font-size: 12px; color: var(--muted); backdrop-filter: blur(6px); }
.chip b { color: var(--text); font-weight: 600; }
.chip.rec { color: #fff; background: rgba(255, 61, 110, .85); border-color: transparent; }
.dropzone { position: absolute; inset: 14px; border: 2px dashed var(--accent); border-radius: 14px; display: none; place-items: center; font-size: 16px; font-weight: 600; background: rgba(124, 92, 255, .12); pointer-events: none; }
.dropzone.show { display: grid; }

.pagestrip { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; }
.pagestrip .label { color: var(--muted); white-space: nowrap; font-size: 12px; margin-right: 4px; }
.thumbs { display: flex; gap: 6px; }
.thumb { position: relative; flex: none; border: 2px solid transparent; border-radius: 6px; cursor: pointer; background: #fff; padding: 0; line-height: 0; }
.thumb canvas { height: 54px; border-radius: 4px; display: block; }
.thumb.active { border-color: var(--accent); }
.thumb span { position: absolute; left: 3px; top: 2px; font-size: 10px; line-height: 1.2; color: #333; background: rgba(255, 255, 255, .85); border-radius: 3px; padding: 0 3px; }

.transport { flex: none; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.transport .play { background: var(--accent); border-color: var(--accent); color: #fff; }
.transport .play svg { fill: currentColor; stroke: none; }
.timecode { font-variant-numeric: tabular-nums; font-weight: 600; margin: 0 8px; white-space: nowrap; }
.timecode small { color: var(--muted); font-weight: 500; }
.mini { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.toggle { display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; cursor: pointer; padding: 0 4px; }
.toggle:hover { color: var(--text); }

.timeline { flex: none; height: 100px; position: relative; background: #121219; border-top: 1px solid var(--line); padding: 0 12px; user-select: none; touch-action: none; cursor: ew-resize; }
.ruler { position: relative; height: 20px; }
.ruler span { position: absolute; top: 4px; font-size: 10px; color: var(--dim); transform: translateX(-50%); white-space: nowrap; }
.ruler i { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--line); }
.splits { position: relative; height: 40px; }
.split { position: absolute; top: 2px; bottom: 2px; border-radius: 6px; overflow: hidden; padding: 4px 8px; font-size: 12px; font-weight: 600; color: #fff; border: 2px solid transparent; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.split small { display: block; font-weight: 500; opacity: .75; font-size: 10px; }
.split.current { border-color: #fff; }
.lane { position: relative; height: 26px; margin-top: 4px; border-radius: 5px; background: rgba(255, 255, 255, .03); }
.lane .mk { position: absolute; top: 5px; width: 8px; height: 8px; margin-left: -4px; background: var(--warn); transform: rotate(45deg); border-radius: 1px; }
.lane .bar { position: absolute; top: 4px; height: 10px; border-radius: 3px; background: rgba(124, 92, 255, .55); }
.lane .tick { position: absolute; top: 3px; width: 2px; height: 14px; background: rgba(32, 196, 165, .8); }
.lane .lbl { position: absolute; left: 6px; bottom: 1px; font-size: 10px; color: var(--dim); pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent-2); pointer-events: none; left: 11px; }
.playhead span { position: absolute; top: 0; left: -5px; width: 12px; height: 10px; background: var(--accent-2); clip-path: polygon(0 0, 100% 0, 50% 100%); }

/* ---------- right panel ---------- */
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tab { flex: 1; height: 40px; background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font-weight: 600; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tabbody { flex: 1; overflow-y: auto; min-height: 0; }
.addgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
.addbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 11px; color: var(--muted); }
.addbtn:hover { color: var(--text); border-color: var(--accent); }
.addbtn svg { width: 18px; height: 18px; }
.layers { list-style: none; margin: 0; padding: 6px; border-bottom: 1px solid var(--line); }
.layers .empty { color: var(--dim); padding: 14px 10px; text-align: center; font-size: 12px; }
.layer { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.layer:hover { background: var(--panel2); }
.layer.sel { background: rgba(124, 92, 255, .16); border-color: rgba(124, 92, 255, .6); }
.layer .ico { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--panel3); color: var(--muted); flex: none; }
.layer .ico svg { width: 15px; height: 15px; }
.layer .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .nm small { display: block; color: var(--dim); font-size: 11px; }
.layer .lb { width: 24px; height: 24px; border: 0; background: transparent; border-radius: 5px; cursor: pointer; color: var(--dim); display: grid; place-items: center; padding: 0; }
.layer .lb:hover { color: var(--text); background: var(--panel3); }
.layer .lb svg { width: 15px; height: 15px; }
.layer.hidden .nm { opacity: .45; }
.layer.drag-over { border-top: 2px solid var(--accent); }

.props { padding: 4px 12px 24px; }
.props h3, .tabbody h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 16px 0 8px; font-weight: 700; }
.props h3:first-child { margin-top: 12px; }
.tabbody > .pad { padding: 4px 12px 24px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; margin: 7px 0; }
.row > label { color: var(--muted); font-size: 12px; }
.row .ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .ctl input[type=range] { flex: 1; min-width: 0; }
.row .ctl .val { width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.row .ctl select, .row .ctl input[type=text], .row .ctl input[type=number] { width: 100%; }
.row.full { grid-template-columns: 1fr; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0; }
.note b { color: var(--text); }
.keys { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.keychip { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--panel3); border: 1px solid var(--line); cursor: pointer; }
.keychip.here { border-color: var(--warn); color: var(--warn); }

/* ---------- popover / modal / toast ---------- */
.popover { position: fixed; z-index: 40; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); }
.brushgrid { display: grid; grid-template-columns: repeat(2, 150px); gap: 6px; }
.brushitem { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 7px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; font-size: 12px; }
.brushitem:hover { background: var(--panel3); }
.brushitem.active { border-color: var(--accent); }
.brushitem canvas { width: 136px; height: 34px; background: #fff; border-radius: 5px; }

.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(5, 5, 9, .7); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(3px); }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.modal.wide { width: min(900px, 100%); }
.modal header { padding: 18px 20px 6px; }
.modal header h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.modal header p { margin: 6px 0 0; color: var(--muted); }
.modal .body { padding: 10px 20px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }
.modal .row { grid-template-columns: 150px minmax(0, 1fr); }
.welcome { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--panel2); display: flex; flex-direction: column; gap: 10px; }
.card h4 { margin: 0; font-size: 14px; }
.card p { margin: 0; color: var(--muted); font-size: 12px; }
.card .btn { align-self: flex-start; }
.progress { height: 8px; background: var(--panel3); border-radius: 99px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .15s; }
.tl-canvas { width: 100%; max-height: 52vh; object-fit: contain; background: #000; border-radius: 8px; display: block; }
.kbd-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12px; }
.kbd-grid kbd { background: var(--panel3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-family: inherit; font-size: 11px; white-space: nowrap; justify-self: start; }

#toasts { position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: #2a2a3a; border: 1px solid var(--line); padding: 8px 14px; border-radius: 9px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); animation: tin .18s ease-out; max-width: 80vw; }
.toast.err { border-color: var(--accent-2); }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .workspace { grid-template-columns: 52px minmax(0, 1fr) 280px; }
  .field input[type=range] { width: 70px; }
  .brand span { display: none; }
}
@media (max-width: 820px) {
  .topbar { height: auto; flex-wrap: wrap; padding: 6px 8px; row-gap: 6px; gap: 6px; }
  .ctxbar { order: 5; flex-basis: 100%; padding-left: 0; }
  .topbar .btn.ghost { padding: 0 8px; }
  .topbar .sep { display: none; }
  #btnHelp { display: none; }
  .workspace { grid-template-columns: 48px minmax(0, 1fr); }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 62vh; width: auto; z-index: 30; transform: translateY(100%); transition: transform .2s; box-shadow: 0 -20px 40px rgba(0, 0, 0, .5); border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; }
  .panel.open { transform: none; }
  .panel-toggle { display: inline-flex; }
  #btnTimelapse, .savestate { display: none; }
  .welcome { grid-template-columns: 1fr; }
  .tool { width: 38px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="5" fill="#7c5cff"/><path d="M8 21c4-9 7-9 9-4s5 5 7-3" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="24" cy="14" r="2.4" fill="#ff3d6e"/></svg>
      <span>Inkframe</span>
    </div>
    <div class="group">
      <button class="btn ghost" id="btnNew" title="New project">New</button>
      <button class="btn ghost" id="btnOpen" title="Open a .inkframe project file">Open</button>
      <button class="btn ghost" id="btnSave" title="Save project file (Ctrl+S)">Save</button>
      <span class="sep"></span>
      <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
      <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h2"/></svg></button>
    </div>
    <div class="ctxbar" id="ctxBar"></div>
    <div class="group right">
      <span class="savestate" id="saveState" title="Autosaved to this device">Saved</span>
      <button class="btn ghost" id="btnTimelapse" title="Play and export the drawing process">Timelapse</button>
      <button class="btn primary" id="btnExport">Export</button>
      <button class="btn icon" id="btnHelp" title="Shortcuts and help (?)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.1"/></svg></button>
      <button class="btn icon panel-toggle" id="btnPanel" title="Show panels"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
  </header>

  <main class="workspace">
    <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>

    <section class="center">
      <div class="stage" id="stage">
        <div class="view" id="view">
          <canvas id="main"></canvas>
          <canvas id="overlay"></canvas>
        </div>
        <div class="hud" id="hud"></div>
        <div class="dropzone" id="dropzone">Drop a video, image or font</div>
      </div>
      <div class="pagestrip" id="pagestrip" hidden></div>
      <div class="transport">
        <button class="btn icon" id="btnStart" title="Go to split start (Home)"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>

/** Returns { canvas, bbox } with the person cut out of `src` (a W×H canvas), or null if nobody was found. */

  res.confidenceMasks.forEach(m => m.close());
  let edge = 0, ne = 0;
  for (let x = 0; x < w; x++) { edge += conf[x] + conf[(hh - 1) * w + x]; ne += 2; }
  if (edge / ne > 0.5) for (let i = 0; i < conf.length; i++) conf[i] = 1 - conf[i];

    id.data[i * 4 + 3] = a * 255;
    if (a > 0.3) { const x = i % w, y = (i / w) | 0; if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }

}

/* ---------------- scene-change detection for auto-split ---------------- */
async function detectScenes(threshold, onProgress) {
  const v = mainVideo();
  if (!v) return [];
  const was = time();
  pause();
  const c = document.createElement('canvas'); c.width = 64; c.height = 36;
  const x = c.getContext('2d', { willReadFrequently: true });
  const dur = duration(), step = 0.2;
  let prev = null, lastCut = 0;
  const cuts = [];
  for (let t = 0; t < dur; t += step) {
    await seekAsync(t);
    x.drawImage(v, 0, 0, 64, 36);
    const d = x.getImageData(0, 0, 64, 36).data;
    if (prev) {
      let diff = 0;
      for (let i = 0; i < d.length; i += 4) diff += Math.abs(d[i] - prev[i]) + Math.abs(d[i + 1] - prev[i + 1]) + Math.abs(d[i + 2] - prev[i + 2]);
      diff /= 64 * 36 * 3 * 255;
      if (diff > threshold && t - lastCut > 0.8 && dur - t > 0.5) { cuts.push(t); lastCut = t; }
    }
    prev = d;
    onProgress && onProgress(t / dur);
  }

  return cuts;
}

/* ======================= layer creation ======================= */
function addDraw() {
  const sp = curSplit();
  insertLayer(baseLayer('draw', nextName('Drawing'), { strokes: [], mode: 'static', revealStart: 0, revealDur: Math.min(3, sp.end - sp.start) }));
  if (S.tool !== 'brush' && S.tool !== 'eraser') setTool('brush');
}

async function addAnim() {
  const sp = curSplit(), here = local(), splitDur = sp.end - sp.start;
  const pages = h('input', { type: 'number', min: 1, max: 2000, value: 1 });
  const fps = h('select', {}, [6, 8, 12, 15, 24, 25, 30].map(v => h('option', { value: v, selected: v === 12 }, `${v} fps`)));
  const exp = h('select', {}, [[1, 'On ones (every frame)'], [2, 'On twos (classic)'], [3, 'On threes']].map(([v, t]) => h('option', { value: v, selected: v === 2 }, t)));
  const span = h('select', {}, h('option', { value: 'split' }, `Whole split (${splitDur.toFixed(2)} s)`), h('option', { value: 'here' }, `From playhead (${(splitDur - here).toFixed(2)} s)`));
  const end = h('select', {}, h('option', { value: 'loop' }, 'Loop'), h('option', { value: 'hold' }, 'Hold last page'), h('option', { value: 'hide' }, 'Disappear'));
  const from = h('select', {}, h('option', { value: 'blank' }, 'Blank pages'), h('option', { value: 'ball' }, 'Bouncing ball template'));
  let edited = false;
  const suggest = () => {
    if (edited) return;
    const avail = span.value === 'split' ? splitDur : splitDur - here;
    pages.value = Math.max(1, Math.round(avail * +fps.value / +exp.value));
  };
  pages.oninput = () => { edited = true; };
  [fps, exp, span].forEach(s => s.addEventListener('change', suggest));
  suggest();
  const ok = await modal({
    title: 'How many animation pages?',
    intro: 'Each page is one drawing. We suggest a count from the split length, frame rate and exposure; change it to anything you like.',
    body: [row('Pages', pages), row('Frame rate', fps), row('Exposure', exp), row('Span', span), row('At the end', end), row('Start from', from),
      note('Tip: the video frame sits under every page, so you can trace over it (rotoscope). Onion skin shows neighbouring pages.')],
    buttons: [{ label: 'Cancel', value: null }, { label: 'Create pages', primary: true, value: true }],
  });
  if (!ok) return;
  const n = clamp(Math.round(+pages.value) || 1, 1, 2000);
  const l = baseLayer('anim', nextName('Animation'), {
    pages: Array.from({ length: n }, () => ({ strokes: [] })),
    fps: +fps.value, exposure: +exp.value, start: span.value === 'split' ? 0 : here, end: end.value,
  });
  if (from.value === 'ball') {
    const W = R.W, H = R.H, r = Math.min(W, H) * 0.05;
    l.pages.forEach((p, i) => {
      const ph = i / n, x = W * 0.2 + W * 0.6 * ph, y = H * 0.75 - Math.abs(Math.sin(ph * Math.PI * 2)) * H * 0.35 - r;
      p.strokes.push({ brush: 'pen', color: S.brush.color, size: r * 2, opacity: 1, seed: 1, pts: [[x, y, 1, 0]], vt: 0, rt: Date.now(), dur: 0 });
    });
  }
  insertLayer(l, sp);
  seek(sp.start + l.start + 0.001);
  setTool('brush');
}

async function addSlides() {
  const sp = curSplit(), splitDur = sp.end - sp.start;

}

async function addImageFromFile(file, name) {
  try {

    const el = a.el;
    const sc = Math.min(1, (Math.min(R.W, R.H) * 0.6) / Math.max(el.naturalWidth, el.naturalHeight));
    const l = baseLayer('image', (name || file.name).replace(/\.[^.]+$/, '').slice(0, 30) || nextName('Image'), {
      assetId: a.id, w: el.naturalWidth * sc, h: el.naturalHeight * sc, outlineOn: false, outlineW: Math.round(Math.min(R.W, R.H) * 0.012), outlineColor: '#ffffff', shadow: false,
    });

    insertLayer(l);
    setTool('move');
  } catch (e) { toast(e.message, true); }

async function addVideoOverlay(file) {
  try {
    const a = await addAsset('video', file, file.name);
    hookVideo(a.el);
    await io.fixDuration(a.el);
    const v = a.el;
    const sc = Math.min(R.W * 0.5 / v.videoWidth, R.H * 0.5 / v.videoHeight);
    const l = baseLayer('video', file.name.replace(/\.[^.]+$/, '').slice(0, 30), {
      assetId: a.id, w: v.videoWidth * sc, h: v.videoHeight * sc, offset: local(), loop: false, muted: false, volume: 1,

function addText(x, y, caption = false) {
  const m = Math.min(R.W, R.H);
  const size = Math.round(m * (caption ? 0.055 : 0.08));
  const l = baseLayer('text', caption ? nextName('Caption') : nextName('Text'), caption ? {
    text: 'Your caption goes here', font: S.textFont || 'Poppins', weight: 800, size, color: '#ffffff', strokeColor: '#000000', strokeW: 0,
    box: true, boxColor: '#000000', boxAlpha: 0.7, align: 'center', lh: 1.15, anim: 'karaoke', inAt: 0, inDur: 0.5, cps: 18, hlColor: '#ffe14d', shadow: false,
  } : {
    text: 'Your text', font: S.textFont || 'Poppins', weight: 800, size, color: '#ffffff', strokeColor: '#111111', strokeW: Math.round(size * 0.05),
    box: false, boxColor: '#000000', boxAlpha: 0.75, align: 'center', lh: 1.15, anim: 'pop', inAt: Math.max(0, local()), inDur: 0.5, cps: 18, hlColor: '#ffe14d', shadow: true,
  });
  l.tf.x = x ?? R.W / 2; l.tf.y = y ?? (caption ? R.H * 0.8 : R.H / 2);

async function addRig() {
  let pick = null;
  const grid = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: '8px' } },
    Object.entries(RIG_TEMPLATES).map(([k, t]) => {
      const cv = h('canvas', { width: 300, height: 200, style: { width: '100%', background: '#2a2a3a', borderRadius: '6px' } });
      const l = { bones: buildBones(k), keys: [], color: '#ffd166', outline: '#1b1b2f', outlineW: 4 };
      const J = solve(l, poseAngles(l, 0));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      J.forEach(j => { x0 = Math.min(x0, j.x0, j.x1); y0 = Math.min(y0, j.y0, j.y1); x1 = Math.max(x1, j.x0, j.x1); y1 = Math.max(y1, j.y0, j.y1); });
      const c = cv.getContext('2d'), s = Math.min(240 / (x1 - x0 + 60), 150 / (y1 - y0 + 60));
      c.translate(150 - (x0 + x1) / 2 * s, 100 - (y0 + y1) / 2 * s); c.scale(s, s);
      Promise.resolve(__rig).then(m => m.drawRig(c, l, J));
      const b = h('button', { class: 'brushitem', style: { width: '100%' }, onclick: () => { pick = k; grid.querySelectorAll('.brushitem').forEach(x => x.classList.toggle('active', x === b)); } }, cv, t.name);
      return b;
    }));
  const ok = await modal({ title: 'Add a rig', intro: 'Pick a template. Every bone can be posed, keyed, resized, added or deleted afterwards.', body: grid, wide: true,
    buttons: [{ label: 'Cancel', value: null }, { label: 'Add rig', primary: true, value: true, onClick: () => { if (!pick) { toast('Pick a template first'); return false; } } }] });
  if (!ok || !pick) return;
  const l = baseLayer('rig', RIG_TEMPLATES[pick].name, {
    template: pick, bones: buildBones(pick), keys: [], color: '#ffd166', outline: '#1b1b2f', outlineW: 4, face: true,
    preset: 'none', presetSpeed: 1, presetAmt: 1,
  });
  const J = solve(l, poseAngles(l, 0));
  const ys = J.flatMap(j => [j.y0, j.y1]);
  const hgt = Math.max(...ys) - Math.min(...ys) || 200;
  l.tf.s = Math.round((R.H * 0.35) / hgt * 100) / 100;
  l.tf.x = R.W / 2; l.tf.y = R.H * 0.55;
  insertLayer(l);
  setTool('rig');
}

/* ======================= layers panel ======================= */
function buildAddGrid() {
  const g = $('#addGrid');
  const items = [
    ['draw', 'Drawing', addDraw], ['anim', 'Animation', addAnim], ['slides', 'Slides', addSlides], ['image', 'Image', () => $('#fileImage').click()],
    ['video', 'Video', () => $('#fileOverlay').click()], ['text', 'Text', () => addText()], ['caption', 'Caption', () => addText(null, null, true)], ['rig', 'Rig', addRig],
  ];
  g.innerHTML = '';
  for (const [ic, label, fn] of items) g.append(h('button', { class: 'addbtn', title: `Add ${label.toLowerCase()} layer`, onclick: () => { if (S.project) fn(); } }, icon(ic), label));

function layerSub(l) {
  let s = '';
  if (l.type === 'draw') s = `${l.strokes.length} strokes · ${({ static: 'static', live: 'live', reveal: 'reveal' })[l.mode || 'static']}`;
  else if (l.type === 'anim') s = `${l.pages.length} pages · ${l.fps} fps`;
  else if (l.type === 'slides') s = `${l.slides.length} slides`;
  else if (l.type === 'text') s = (l.text || '').split('\n')[0].slice(0, 26);
  else if (l.type === 'rig') s = RIG_TEMPLATES[l.template] ? RIG_TEMPLATES[l.template].name : 'Rig';
  else if (l.type === 'image') s = l.outlineOn ? 'Image · sticker' : 'Image';
  else if (l.type === 'video') s = 'Video overlay' + (l.keyOn ? ' · keyed' : '');
  if (l.motion && l.motion.pts && l.motion.pts.length > 1) s += ' · motion';
  return s;
}

let dragIdx = -1;
function renderLayers() {
  const list = $('#layerList');
  list.innerHTML = '';
  if (!S.project) return;
  const sp = curSplit();
  if (!sp.layers.length) {
    list.append(h('li', { class: 'empty' }, `${sp.name} has no layers yet. Pick the brush and draw, or add a layer above.`));
    return;
  }
  for (let di = sp.layers.length - 1; di >= 0; di--) {
    const l = sp.layers[di];
    const li = h('li', {
      class: 'layer' + (l.id === S.sel.layerId ? ' sel' : '') + (l.visible ? '' : ' hidden'), draggable: true,
      onclick: () => select(l.id),
      ondblclick: () => renameLayer(l),
      ondragstart: e => { dragIdx = di; e.dataTransfer.effectAllowed = 'move'; },
      ondragover: e => { e.preventDefault(); li.classList.add('drag-over'); },
      ondragleave: () => li.classList.remove('drag-over'),
      ondrop: e => {
        e.preventDefault();
        if (dragIdx < 0 || dragIdx === di) return;
        checkpoint();
        const [m] = sp.layers.splice(dragIdx, 1);
        sp.layers.splice(di, 0, m);
        dragIdx = -1; S.dirty = true; scheduleSave(); renderLayers();
      },
    },
    h('span', { class: 'ico' }, icon(TYPE_ICON[l.type])),
    h('span', { class: 'nm' }, l.name, h('small', {}, layerSub(l))),
    h('button', { class: 'lb', title: l.locked ? 'Unlock' : 'Lock', onclick: e => { e.stopPropagation(); checkpoint(); l.locked = !l.locked; renderLayers(); }, style: { color: l.locked ? '#ffb020' : '' } }, icon('lock')),
    h('button', { class: 'lb', title: l.visible ? 'Hide' : 'Show', onclick: e => { e.stopPropagation(); checkpoint(); l.visible = !l.visible; touch(l); renderLayers(); } }, icon(l.visible ? 'eye' : 'eyeoff')),
    h('button', { class: 'lb', title: 'Delete layer', onclick: e => { e.stopPropagation(); deleteLayer(l.id); } }, icon('trash')));
    list.append(li);
  }
}
async function renameLayer(l) {
  const inp = h('input', { type: 'text', value: l.name, style: { width: '100%' } });
  const ok = await modal({ title: 'Rename layer', body: inp, buttons: [{ label: 'Cancel', value: null }, { label: 'Rename', primary: true, value: true }] });
  if (ok && inp.value.trim()) { checkpoint(); l.name = inp.value.trim(); scheduleSave(); renderLayers(); renderProps(); }
}
function deleteLayer(id) {
  const f = findLayer(id);
  if (!f) return;
  checkpoint();
  f.split.layers = f.split.layers.filter(l => l.id !== id);
  if (S.sel.layerId === id) S.sel.layerId = null;
  S.dirty = true; scheduleSave();
  refreshUI();
}
function duplicateLayer() {
  const l = selected();
  if (!l) return;
  checkpoint();
  const c = JSON.parse(JSON.stringify(l));
  c.id = uid(); c.name = l.name + ' copy'; c.v = nextVer();
  const sp = curSplit();
  sp.layers.splice(sp.layers.indexOf(l) + 1, 0, c);
  select(c.id); S.dirty = true; scheduleSave();
}

/* ======================= properties panel ======================= */
function renderProps() {

  P.innerHTML = '';
  if (!S.project) return;
  const f = findLayer(S.sel.layerId);
  if (!f) {
    P.append(heading('Getting started'),
      note('<b>Draw:</b> pick the brush (B) and draw on the video. A drawing layer is created for you.'),
      note('<b>Split:</b> press S to cut the video at the playhead. Each split has its own layers.'),
      note('<b>Animate:</b> add an Animation layer, choose how many pages, then draw page by page with onion skin.'),

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ======================= motion helpers ======================= */
function setBase(l, p) {
  if (isCanvasLayer(l)) { l.tf.x = p.x - R.W / 2; l.tf.y = p.y - R.H / 2; } else { l.tf.x = p.x; l.tf.y = p.y; }
}
function shiftLayer(l, dx, dy) {
  l.tf.x += dx; l.tf.y += dy;
  if (l.motion && l.motion.pts) l.motion.pts.forEach(p => { p.x += dx; p.y += dy; });
}
function smoothPts(pts, k) {
  if (k <= 0 || pts.length < 3) return pts;
  return pts.map((p, i) => {
    if (i === 0 || i === pts.length - 1) return p;
    let sx = 0, sy = 0, n = 0;
    for (let j = Math.max(0, i - k); j <= Math.min(pts.length - 1, i + k); j++) { sx += pts[j].x; sy += pts[j].y; n++; }
    return { t: p.t, x: sx / n, y: sy / n };
  });
}
async function saveMotionPreset(l) {
  const inp = h('input', { type: 'text', value: `${l.name} motion`, style: { width: '100%' } });
  const ok = await modal({ title: 'Save motion preset', intro: 'Reuse this path on any layer, in any split.', body: inp, buttons: [{ label: 'Cancel', value: null }, { label: 'Save', primary: true, value: true }] });
  if (!ok) return;
  const p0 = l.motion.pts[0];
  S.project.motionPresets.push({ name: inp.value || 'Motion', pts: l.motion.pts.map(p => ({ t: p.t - p0.t, dx: p.x - p0.x, dy: p.y - p0.y })) });
  scheduleSave(); renderProps();
  toast('Motion preset saved');
}
function applyMotionPreset(l, pr, mirror) {
  checkpoint();
  const t0 = local(), base = pivotAt(l, t0);
  const add = pr.pts.map(p => ({ t: t0 + p.t, x: base.x + (mirror ? -p.dx : p.dx), y: base.y + p.dy }));
  l.motion = { pts: mergeMotion(l.motion && l.motion.pts, add, true) };
  touch(l); renderProps(); renderLayers(); renderLane();
}
function mergeMotion(old, add, punch) {
  if (!punch || !old || !old.length || !add.length) return add;
  const a = add[0].t, b = add[add.length - 1].t;
  return [...old.filter(p => p.t < a), ...add, ...old.filter(p => p.t > b)];
}

/* ======================= rig keys ======================= */
function keyPose() {
  const l = selected();
  if (!l || l.type !== 'rig') { toast('Select a rig layer first'); return; }
  checkpoint();
  ensureKey(l, local(), poseAngles(l, local(), false));
  touch(l); renderProps(); renderLane();
  toast(`Pose keyed at ${local().toFixed(2)} s`);
}
function ensureKey(l, t, A) {
  l.keys = l.keys || [];
  let k = l.keys.find(k2 => Math.abs(k2.t - t) < 1 / 60);
  if (!k) { k = { t, a: [] }; l.keys.push(k); l.keys.sort((x, y) => x.t - y.t); }
  k.a = Array.from(A);
  return k;
}

/* ======================= image clean-up & cutouts ======================= */
async function canvasToLayer(cv, bbox, name, sticker) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bbox.w)); c.height = Math.max(1, Math.round(bbox.h));
  c.getContext('2d').drawImage(cv, bbox.x, bbox.y, bbox.w, bbox.h, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const a = await addAsset('image', blob, name + '.png');
  const l = baseLayer('image', nextName(name), {
    assetId: a.id, w: c.width, h: c.height, outlineOn: sticker, outlineW: Math.round(Math.min(R.W, R.H) * 0.012), outlineColor: '#ffffff', shadow: sticker, cutout: true,
  });
  l.tf.x = bbox.x + bbox.w / 2; l.tf.y = bbox.y + bbox.h / 2;
  insertLayer(l);
  return l;
}

function cutSource() {
  const t = time(), sp = curSplit(), lt = t - sp.start;
  const c = document.createElement('canvas'); c.width = R.W; c.height = R.H;
  const x = c.getContext('2d');
  if (S.cutSrc === 'video') {
    const v = mainVideo();
    if (!v) { toast('This project has no video; cutting from everything visible instead.'); x.drawImage(R.main, 0, 0); }
    else drawContain(x, v, v.videoWidth, v.videoHeight);
  } else if (S.cutSrc === 'layer') {
    const l = selected();
    if (!l) { toast('Select a layer to cut from', true); return null; }
    renderLayer(x, l, lt, sp);
  } else x.drawImage(R.main, 0, 0);
  return c;
}

async function lassoCutout(pts) {
  const src = cutSource();
  if (!src) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(R.W, Math.ceil(x1)); y1 = Math.min(R.H, Math.ceil(y1));
  if (x1 - x0 < 4 || y1 - y0 < 4) return;
  const out = document.createElement('canvas'); out.width = R.W; out.height = R.H;
  const o = out.getContext('2d');
  o.beginPath(); pts.forEach((p, i) => (i ? o.lineTo(p.x, p.y) : o.moveTo(p.x, p.y))); o.closePath();
  o.save(); o.clip(); o.drawImage(src, 0, 0); o.restore();
  await canvasToLayer(out, { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, 'Cutout', S.cutSticker);
  toast('Cutout added as a new layer on top. Drag it, record motion on it, or draw behind it.');
}

async function autoCutoutNow() {
  if (!S.project) return;
  const src = cutSource();
  if (!src) return;
  toast('Finding the person… (first use downloads a small model)');
  try {
    const r = await io.autoCutout(src);
    if (!r) { toast('No person found in this frame', true); return; }
    await canvasToLayer(r.canvas, r.bbox, 'Person cutout', S.cutSticker);
    toast('Person cut out as a new layer');
  } catch (e) {
    console.error(e);
    toast('Auto cutout needs an internet connection the first time. Use the lasso instead.', true);
  }
}

async function removeBgColour(l) {
  const a = assets.get(l.assetId);
  if (!a) return;
  const tol = h('input', { type: 'range', min: 2, max: 120, value: 40 });
  const ok = await modal({ title: 'Remove background colour', intro: 'Makes pixels similar to the top-left corner colour transparent. Works best on flat backgrounds like screenshots and logos.', body: row('Tolerance', tol), buttons: [{ label: 'Cancel', value: null }, { label: 'Remove', primary: true, value: true }] });
  if (!ok) return;
  const el = a.el, c = document.createElement('canvas');
  c.width = el.naturalWidth; c.height = el.naturalHeight;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(el, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  const r0 = p[0], g0 = p[1], b0 = p[2], T = +tol.value;
  for (let i = 0; i < p.length; i += 4) {
    const dist = Math.hypot(p[i] - r0, p[i + 1] - g0, p[i + 2] - b0);
    if (dist < T) p[i + 3] = 0; else if (dist < T * 1.5) p[i + 3] *= (dist - T) / (T * 0.5);
  }
  x.putImageData(d, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const na = await addAsset('image', blob, a.name.replace(/\.\w+$/, '') + '-clean.png');
  checkpoint();
  l.assetId = na.id;
  touch(l); renderProps();
}

/* ======================= split tab ======================= */
function splitAtTime(t) {
  const sp = splitAt(t);
  if (t - sp.start < 0.05 || sp.end - t < 0.05) { toast('Too close to a split edge'); return false; }
  const i = S.project.splits.indexOf(sp);
  const ns = makeSplit(t, sp.end, i + 1);
  sp.end = t;
  S.project.splits.splice(i + 1, 0, ns);
  renumber();
  return true;
}
function renumber() {
  S.project.splits.forEach((s, i) => {
    if (/^Split \d+$/.test(s.name)) s.name = `Split ${i + 1}`;
    if (!s.color) s.color = SPLIT_COLORS[i % SPLIT_COLORS.length];
  });
}
function doSplit() {
  if (!S.project) return;
  checkpoint();
  if (splitAtTime(time())) { S.dirty = true; scheduleSave(); refreshUI(); toast(`Split at ${fmtTime(time())}`); } else S.undo.pop();
}
function shiftLayerTime(l, dt) {
  if (l.strokes) l.strokes.forEach(s => { s.vt = (s.vt || 0) + dt; });
  if (l.motion && l.motion.pts) l.motion.pts.forEach(p => { p.t += dt; });
  if (l.keys) l.keys.forEach(k => { k.t += dt; });
  if ('start' in l) l.start = (l.start || 0) + dt;
  if ('revealStart' in l) l.revealStart = (l.revealStart || 0) + dt;
  if ('inAt' in l) l.inAt = (l.inAt || 0) + dt;
  if ('offset' in l) l.offset = (l.offset || 0) + dt;
}
function mergeNext(sp) {
  const sps = S.project.splits, i = sps.indexOf(sp);
  if (i < 0 || i >= sps.length - 1) return;
  checkpoint();
  const nx = sps[i + 1], dt = nx.start - sp.start;
  nx.layers.forEach(l => { shiftLayerTime(l, dt); touch(l); });
  sp.layers.push(...nx.layers);
  sp.end = nx.end;
  sps.splice(i + 1, 1);
  renumber(); S.dirty = true; scheduleSave(); refreshUI();
}

  drag = { type: 'motion' };
  ui.motionRec = true;
  if (local() >= sp.end - sp.start - 0.05) seek(sp.start);
  play();
  updateHud(true);
}
function sampleMotion() {
  const M = S.motionRec;
  const t = time(), lt = t - M.sp.start;
  if (!S.playing || t >= M.sp.end - 0.02) { stopMotionRec(); return; }
  const x = M.ptr.x - M.off.x, y = M.ptr.y - M.off.y;
  const last = M.pts[M.pts.length - 1];
  if (!last || lt > last.t + 0.004) M.pts.push({ t: lt, x, y });
  M.l.motion = { pts: [{ t: lt, x, y }] };
  S.dirty = true;
}
function stopMotionRec() {
  const M = S.motionRec;
  if (!M) return;
  S.motionRec = null; ui.motionRec = false;
  if (drag && drag.type === 'motion') drag = null;
  pause();
  const l = M.l;
  if (M.pts.length < 2) { l.motion = M.orig ? { pts: M.orig } : null; S.undo.pop(); toast('Hold and drag while it plays to record a path'); }
  else {
    l.motion = { pts: mergeMotion(M.orig, smoothPts(M.pts, S.motionSmooth), S.motionPunch) };
    toast(`Recorded ${(M.pts[M.pts.length - 1].t - M.pts[0].t).toFixed(2)} s of motion`);
  }
  touch(l);
  renderProps(); renderLayers(); renderLane(); updateHud(true);
}

/* ---- rig posing ---- */
function rigDown(e, p) {
  const sp = curSplit(), lt = local();
  let l = selected();
  if (!l || l.type !== 'rig') {
    const hit = hitTest(sp, lt, p.x, p.y);
    if (hit && hit.type === 'rig') { select(hit.id); l = hit; } else { toast('Add or select a rig layer'); return; }
  }
  if (l.locked) { toast('This layer is locked'); return; }
  const q = toLocal(l, lt, p.x, p.y);
  const A = poseAngles(l, lt, false);
  const J = solve(l, A);
  const tol = 14 / (view.z * (l.tf.s || 1));
  let best = -1, bd = tol;
  J.forEach((j, i) => { if (l.bones[i].len <= 0) return; const d = Math.hypot(q.x - j.x1, q.y - j.y1); if (d < bd) { bd = d; best = i; } });
  checkpoint();
  if (best < 0 && Math.hypot(q.x - J[0].x0, q.y - J[0].y0) < tol * 1.4) {
    drag = { type: 'move', l, last: p, sx: p.x, sy: p.y };
    return;
  }
  if (best < 0) {
    J.forEach((j, i) => {
      if (l.bones[i].len <= 0) return;
      const vx = j.x1 - j.x0, vy = j.y1 - j.y0, L2 = vx * vx + vy * vy || 1;
      const f = clamp(((q.x - j.x0) * vx + (q.y - j.y0) * vy) / L2, 0, 1);
      const d = Math.hypot(q.x - (j.x0 + vx * f), q.y - (j.y0 + vy * f));
      if (d < l.bones[i].w / 2 + tol && d < bd + l.bones[i].w) { bd = d; best = i; }
    });
  }
  if (best < 0) { S.undo.pop(); return; }
  S.sel.bone = best;
  const keyed = (l.keys && l.keys.length) || S.autoKey;
  drag = { type: 'rig', l, i: best, A: Array.from(A), keyed, ik: S.rigIK !== e.shiftKey };
  renderProps();
  S.odirty = true;
}
function rigMove(e, p) {
  const d = drag, l = d.l, lt = local();
  const q = toLocal(l, lt, p.x, p.y);
  const A = d.A;
  A.dy = 0;
  const b = l.bones[d.i];
  const hasChildren = l.bones.some(x => x.p === d.i);
  if (d.ik && !hasChildren) ikReach(l, A, d.i, q.x, q.y, 2);
  else fkAim(l, A, d.i, q.x, q.y);
  if (d.keyed) ensureKey(l, lt, A);
  else A.forEach((a, k) => { l.bones[k].a = a; });
  void b;
  touch(l);
}

/* ======================= transport & keys ======================= */
function bindTransport() {
  $('#btnPlay').onclick = () => toggle();
  $('#btnPrev').onclick = () => step(-1);
  $('#btnNext').onclick = () => step(1);
  $('#btnStart').onclick = () => { pause(); const sp = curSplit(); seek(time() - sp.start < 0.05 ? Math.max(0, sp.start - 0.01) : sp.start); };
  $('#btnEnd').onclick = () => { pause(); seek(curSplit().end - 1 / 30); };
  $('#rateSel').onchange = e => setRate(parseFloat(e.target.value));
  $('#loopChk').onchange = e => { S.loopSplit = e.target.checked; };
  $('#onionChk').onchange = e => { S.onion.on = e.target.checked; S.odirty = true; };
  $('#guidesChk').onchange = e => { S.guides = e.target.checked; S.odirty = true; };
  $('#btnFit').onclick = fitView;
  $('#btnZoomIn').onclick = () => zoomAt(1.25);
  $('#btnZoomOut').onclick = () => zoomAt(0.8);
  $('#btnUndo').onclick = doUndo;
  $('#btnRedo').onclick = doRedo;
  $('#btnNew').onclick = () => showWelcome();
  $('#btnOpen').onclick = () => $('#fileProject').click();
  $('#btnSave').onclick = () => S.project && io.saveProjectFile();
  $('#btnExport').onclick = () => S.project && io.exportVideo();
  $('#btnTimelapse').onclick = () => S.project && io.timelapse();
  $('#btnHelp').onclick = showHelp;
  $('#btnPanel').onclick = () => $('#panel').classList.toggle('open');
  listeners.play.push(() => {
    $('#btnPlay').innerHTML = S.playing ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    if (S.playing) S.loopFrom = curSplit();
  });
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    for (const id of ['layers', 'split', 'project']) $('#tab-' + id).hidden = id !== t.dataset.tab;
    if (t.dataset.tab === 'split') renderSplitTab();
    if (t.dataset.tab === 'project') renderProjectTab();
  });
}
function step(dir) {
  if (!S.project) return;
  pause();
  const l = selected();
  if (l && l.type === 'anim') {
    const i = animPageAt(l, local());
    const n = clamp((i < 0 ? 0 : i) + dir, 0, l.pages.length - 1);
    gotoPage(l, n);
  } else if (l && l.type === 'slides') {
    gotoPage(l, clamp(slideAt(l, local()).i + dir, 0, l.slides.length - 1));
  } else seek(time() + dir / 30);
}
function doUndo() { if (undo()) { R.cache.clear(); refreshUI(); } else toast('Nothing to undo'); }
function doRedo() { if (redo()) { R.cache.clear(); refreshUI(); } else toast('Nothing to redo'); }

function bindKeys() {
  window.addEventListener('keydown', e => {
    if (!S.project) return;
    const tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) return;
    if ($('#modalRoot').children.length) return;
    const k = e.key, mod = e.ctrlKey || e.metaKey;
    if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
    if (mod && k.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
    if (mod && k.toLowerCase() === 's') { e.preventDefault(); io.saveProjectFile(); return; }
    if (mod && k.toLowerCase() === 'd') { e.preventDefault(); duplicateLayer(); return; }
    if (mod) return;
    if (k === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; spaceUsed = false; $('#stage').style.cursor = 'grab'; } return; }
    const map = { b: 'brush', e: 'eraser', v: 'move', m: 'motion', t: 'text', l: 'cutout', r: 'rig', i: 'picker' };
    const lk = k.toLowerCase();
    if (map[lk]) { setTool(map[lk]); return; }
    if (lk === 's') { doSplit(); return; }
    if (lk === 'k') { keyPose(); return; }
    if (lk === 'o') { S.onion.on = !S.onion.on; $('#onionChk').checked = S.onion.on; S.odirty = true; return; }
    if (lk === 'g') { S.guides = !S.guides; $('#guidesChk').checked = S.guides; S.odirty = true; return; }
    if (k === 'Enter') { toggle(); return; }
    if (k === ',' || k === 'ArrowLeft') { step(-1); return; }
    if (k === '.' || k === 'ArrowRight') { step(1); return; }
    if (k === 'Home') { pause(); seek(curSplit().start); return; }
    if (k === 'End') { pause(); seek(curSplit().end - 1 / 30); return; }
    if (k === '0') { fitView(); return; }
    if (k === '=' || k === '+') { zoomAt(1.25); return; }
    if (k === '-') { zoomAt(0.8); return; }
    if (k === '[' || k === ']') {
      const f = k === '[' ? 0.85 : 1.18;
      if (S.tool === 'eraser') S.eraser.size = clamp(Math.round(S.eraser.size * f), 2, 300);
      else S.brush.size = clamp(Math.round(S.brush.size * f) + (k === ']' ? 1 : 0), 1, 200);
      buildCtxBar(); S.odirty = true; return;
    }
    if ((k === 'Delete' || k === 'Backspace') && S.sel.layerId) { deleteLayer(S.sel.layerId); return; }
    if (k === '?') { showHelp(); return; }
    if (k === 'Escape') { select(null); return; }
  });
  window.addEventListener('keyup', e => {
    if (e.key === ' ') {
      if (spaceDown && !spaceUsed && !(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))) toggle();
      spaceDown = false; setTool(S.tool);
    }
  });
}

function showHelp() {
  const keys = [
    ['Space / Enter', 'Play / pause (hold Space and drag to pan)'], ['B · E · V · M', 'Brush · eraser · move · record motion'], ['T · L · R · I', 'Text · cutout lasso · rig · eyedropper'],
    ['S', 'Split the video at the playhead'], [', and .', 'Previous / next frame (or animation page)'], ['O · G', 'Onion skin · guides'],
    ['[ and ]', 'Brush size'], ['K', 'Key the rig pose at the playhead'], ['Ctrl+Z · Ctrl+Shift+Z', 'Undo · redo'], ['Ctrl+D', 'Duplicate layer'],
    ['Ctrl+S', 'Save project file'], ['Delete', 'Delete selected layer'], ['Ctrl+wheel · pinch', 'Zoom (0 to fit)'], ['Shift / Alt + drag', 'Scale / rotate with the move tool'],
  ];
  modal({
    title: 'Shortcuts and tips', wide: true,
    body: [h('div', { class: 'kbd-grid' }, keys.flatMap(([a, b]) => [h('kbd', {}, a), h('span', {}, b)])),
      heading('How it fits together'),
      note('<b>Splits</b> cut your video into segments; each split has its own layers. <b>Drawing layers</b> record every stroke, so they can play back live, reveal themselves, or become a timelapse. <b>Animation layers</b> hold frame-by-frame pages. <b>Motion</b> records a drag as a path you can reuse. <b>Rigs</b> are posable puppets with keys and motion presets.'),
      note('Your work autosaves on this device. Use Save to keep a .inkframe file.')],
    buttons: [{ label: 'Close', primary: true, value: true }],
  });
}

/* ======================= files & drag-drop ======================= */
function bindFiles() {
  const one = (id, fn) => { const el = $(id); el.onchange = () => { const f = el.files[0]; el.value = ''; if (f) fn(f); }; };
  one('#fileVideo', newFromVideo);
  one('#fileImage', f => addImageFromFile(f));
  one('#fileOverlay', addVideoOverlay);
  one('#fileFont', uploadFont);
  one('#fileProject', f => io.openProjectFile(f, loadProject));
  const dz = $('#dropzone');
  let depth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { depth++; dz.classList.add('show'); } });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) dz.classList.remove('show'); });
  window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault(); depth = 0; dz.classList.remove('show');
    const f = e.dataTransfer.files[0];
    const n = f.name.toLowerCase();
    closeAllIfWelcome();
    if (n.endsWith('.inkframe')) io.openProjectFile(f, loadProject);
    else if (/\.(otf|ttf|woff2?)$/.test(n)) { if (S.project) { fontTarget = selected() && selected().type === 'text' ? selected() : null; uploadFont(f); } }
    else if (f.type.startsWith('video/')) { if (S.project) addVideoOverlay(f); else newFromVideo(f); }
    else if (f.type.startsWith('image/')) { if (S.project) addImageFromFile(f); }
  });
}
function closeAllIfWelcome() { if (!S.project) $('#modalRoot').innerHTML = ''; }

/* ======================= refresh & loop ======================= */
function refreshUI() {
  if (!S.project) return;
  if (S.sel.layerId && !findLayer(S.sel.layerId)) S.sel.layerId = null;
  renderLayers(); renderProps(); renderTimeline(); renderStrip(true); buildCtxBar(); updateHud(true);
  if (!$('#tab-split').hidden) renderSplitTab();
  if (!$('#tab-project').hidden) renderProjectTab();
  S.dirty = true; S.odirty = true;
}

let lastSplit = null, lastT = -1, lastLaneT = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (!S.project) return;
  stepClock(now);
  let t = time();
  if (S.playing && S.loopSplit && !S.exporting && !S.motionRec && S.loopFrom && t >= S.loopFrom.end - 0.02) { seek(S.loopFrom.start); t = S.loopFrom.start; }
  if (S.exporting && S.exportEnd != null && S.playing && t >= S.exportEnd - 0.01) pause();
  if (S.motionRec) sampleMotion();
  const sp = splitAt(t);
  if (sp !== lastSplit) {
    lastSplit = sp;
    renderLayers(); renderProps(); renderStrip(); renderTimeline();
    if (!$('#tab-split').hidden) renderSplitTab();
  }
  const moved = t !== lastT;
  if (S.playing || S.dirty || moved || S.live) {
    render(t);
    S.dirty = false; S.odirty = true;
  }
  if (S.odirty || S.playing) {
    renderOverlay(t, ui);
    S.odirty = false;
  }
  if (moved) {
    lastT = t;
    $('#playhead').style.left = `calc(11px + (100% - 24px) * ${tlFrac(t)})`;
    $('#timecode').innerHTML = `${fmtTime(t)} <small>/ ${fmtTime(duration())} · f${Math.floor(t * 30)}</small>`;
    markStrip();
    updateHud();
    if (!S.playing && now - lastLaneT > 120 && selected() && selected().type === 'rig') { lastLaneT = now; renderProps(); }
  }
}

/* ======================= boot ======================= */
function boot() {
  setupRenderer($('#main'), $('#overlay'));
  buildToolbar();
  buildAddGrid();
  bindTransport();
  bindTimeline();
  bindStage();
  bindKeys();
  bindFiles();
  setTool('brush');
  saveListeners.push(ok => { const s = $('#saveState'); s.textContent = ok ? 'Saved' : 'Save failed'; s.classList.toggle('err', !ok); });
  window.addEventListener('resize', () => { if (S.project) fitView(); });
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { S.dirty = true; });
  requestAnimationFrame(tick);
  showWelcome();
  
}
boot();

// exposed for debugging in the console
window.inkframe = { S, R, assets, time, seek, play, pause, loadProject, newBlank };

return {  };
})();
</script>
